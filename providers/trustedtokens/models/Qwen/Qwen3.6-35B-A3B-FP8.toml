# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Reasoning measured 2026-10-28 on /v1/chat/completions (reasoning_content chars): none 0, medium 710, high 722.
# `none` is an off state; medium/high do not grade. No toggle is forwarded: reasoning.enabled, thinking.type
# and chat_template_kwargs.enable_thinking all leave reasoning on.
# Image input accepted; video_url returns 422, so the lab's video formats are omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "alibaba/qwen3.6-35b-a3b"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.25
cache = { read = 0.05 }

[cost.text.output]
price = 1.5
