# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Reasoning measured 2026-10-28 on /v1/chat/completions (reasoning_content chars): none 0, medium 482,
# high 478. `none` is an off state; medium/high do not grade.
# No toggle is forwarded: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Image input accepted; video_url returns 422, so the lab's video format is omitted.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 262_144

[cost.text.input]
price = 0.15
cache = { read = 0.02 }

[cost.text.output]
price = 0.5
