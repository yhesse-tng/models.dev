# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Reasoning measured 2026-10-28 on /v1/chat/completions (reasoning_content chars): none 0, low 535,
# high 553, max 651. `none` is an off state; low/high overlap; max is distinct.
# No toggle is forwarded: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Text-only: image input returns 422 "Model only supports text".
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.2"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["none", "high", "max"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 1.5
cache = { read = 0.3 }

[cost.text.output]
price = 4.5
