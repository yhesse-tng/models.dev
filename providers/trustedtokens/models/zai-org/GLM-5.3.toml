# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Reasoning measured 2026-10-28 on /v1/chat/completions (reasoning_content chars): none 561 (not off),
# low 38, high 42, max 570. low/high overlap; max is distinct; there is no caller off control.
# No toggle is forwarded: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on. Tool calls need effort=low; `none` consumes the token budget.
# Text-only: image input returns 422 "Model only supports text".
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "zhipuai/glm-5.3"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true
cache = { implicit = true }

[limit]
context = 230_000

[cost.text.input]
price = 1.5
cache = { read = 0.3 }

[cost.text.output]
price = 4.5
