# Costs and catalog: https://api.trustedtokens.eu/v1/models (accessed 2026-10-28).
# Reasoning measured 2026-10-28 on /v1/chat/completions (reasoning_content chars): none 0, medium 667,
# high 667. `none` is an off state; medium/high do not grade.
# No toggle is forwarded: reasoning.enabled, thinking.type and chat_template_kwargs.enable_thinking
# all leave reasoning on.
# Image input accepted; the lab's image formats are inherited.
# Cache: implicit prefix caching measured (repeat prompt reports cached_tokens); first request is cold.
# Reasoning side channel: message.reasoning_content.
schema = 2
base_model = "google/gemma-4-26b-a4b-it"

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[capabilities]
reasoning = { supported = true, effort = ["none", "medium"] }
structured_output = true
cache = { implicit = true }

[cost.text.input]
price = 0.3
cache = { read = 0.05 }

[cost.text.output]
price = 0.8
